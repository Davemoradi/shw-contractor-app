<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting — Select Home Warranty</title>
<!-- landing.html was a near-duplicate of index.html: same H1, same form, same Stripe links.
     Two indexable pages on one funnel compete in search and double the maintenance surface.
     This forwards to the primary page and preserves query params (sp=, utm_*) so salesperson
     attribution and campaign tracking survive the hop.
     To bring the full page back instead, restore the previous landing.html from git history. -->
<link rel="canonical" href="https://apply.selectservicepros.com/">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0;url=/">
<script>location.replace('/' + (location.search || '') + (location.hash || ''));</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px;text-align:center;color:#3c4457">
<p>Redirecting to <a href="/">apply.selectservicepros.com</a>&hellip;</p>
</body>
</html>
